[package]
name = "unknowncreations778/spotify-console"
version = "0.1.0"
description = "Private Spotify Console static site"

[dependencies]
"wasmer/static-web-server" = "1"

[fs]
public = "public"
settings = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "wasi"

[command.annotations.wasi]
main-args = ["--config", "settings/config.toml"]
